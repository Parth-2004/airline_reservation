<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AirBook — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #050810;
  --card:     rgba(15,25,45,0.82);
  --border:   rgba(59,130,246,0.2);
  --accent:   #3B82F6;
  --accent2:  #8B5CF6;
  --green:    #10B981;
  --red:      #EF4444;
  --text:     #E2E8F0;
  --muted:    #64748B;
  --dim:      #94A3B8;
  --input-bg: rgba(8,15,30,0.9);
  --F: 'Rajdhani',sans-serif;
  --M: 'JetBrains Mono',monospace;
  --B: 'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--B);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;background-image:url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1920&q=80');background-size:120%;background-position:center;animation:pan 25s ease-in-out infinite alternate}
#ov{position:fixed;inset:0;z-index:1;background:linear-gradient(135deg,rgba(5,8,16,.95),rgba(8,12,24,.9),rgba(5,8,16,.97))}
@keyframes pan{0%{background-size:120%;background-position:30% 40%}100%{background-size:130%;background-position:70% 55%}}

.wrap{position:relative;z-index:2;width:100%;max-width:440px;padding:20px}

/* Logo */
.logo{text-align:center;margin-bottom:36px}
.logo-mark{display:inline-flex;align-items:center;gap:10px;font-family:var(--F);font-size:32px;font-weight:700;letter-spacing:1px}
.logo-mark svg{width:32px;height:32px}
.logo-sub{font-family:var(--M);font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:6px}

/* Card */
.card{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:36px;box-shadow:0 24px 64px rgba(0,0,0,.6)}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:28px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-family:var(--F);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);transition:all .2s;background:transparent;border:none}
.tab.active{background:rgba(59,130,246,.15);color:var(--accent)}

/* Form */
.form-group{margin-bottom:18px}
.form-label{display:block;font-family:var(--M);font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:7px}
.form-control{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-family:var(--M);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
.form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.form-control::placeholder{color:var(--muted)}

/* Btn */
.btn{width:100%;padding:12px;border-radius:8px;border:none;cursor:pointer;font-family:var(--F);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;transition:all .2s;margin-top:6px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#1D4ED8);color:#fff;box-shadow:0 0 20px rgba(59,130,246,.35)}
.btn-primary:hover{box-shadow:0 0 32px rgba(59,130,246,.55);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.98)}

/* Messages */
.msg{padding:10px 14px;border-radius:8px;font-family:var(--M);font-size:12px;margin-top:14px;display:none}
.msg.show{display:block}
.msg.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#FCA5A5}
.msg.success{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:#6EE7B7}

/* Divider */
.divider{height:1px;background:var(--border);margin:22px 0;position:relative}
.divider span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,25,45,.95);padding:0 12px;font-family:var(--M);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px}

/* Footer note */
.foot-note{text-align:center;margin-top:20px;font-family:var(--M);font-size:11px;color:var(--muted)}
.foot-note a{color:var(--accent);text-decoration:none}

/* Admin badge */
.admin-note{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.25);border-radius:8px;padding:10px 14px;margin-bottom:20px;font-family:var(--M);font-size:11px;color:#C4B5FD;text-align:center}
</style>
</head>
<body>
<div id="bg"></div>
<div id="ov"></div>

<div class="wrap">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.8 19.2L16 11l3.5-3.5C21 6 21 4 19.5 2.5c-1.5-1.5-3.5-1.5-5 0L11 6 2.8 6.2c-.5.1-.9.4-1.1.8l-1 1.6c-.2.4-.2.8.1 1.1l4.4 4.4-1.4 3.5-2.2.8c-.3.1-.5.4-.5.7v1.6c0 .5.5.9 1 .8l3.5-.6 1.6 3.2c.2.4.6.6 1 .5l1.6-.4c.4-.1.7-.4.8-.8l.8-3.5 4.4 4.4c.3.3.7.3 1.1.1l1.6-1c.4-.2.7-.6.8-1.1z"/>
      </svg>
      AirBook
    </div>
    <div class="logo-sub">Airline Reservation System</div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign In</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="pane-login">
      <div class="admin-note">
        Default admin: <strong>admin</strong> / <strong>admin123</strong>
      </div>
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input class="form-control" id="login-user" type="text" placeholder="Enter username or email" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" id="login-pass" type="password" placeholder="Enter password" autocomplete="current-password"/>
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Sign In →</button>
      <div class="msg" id="login-msg"></div>
    </div>

    <!-- REGISTER FORM -->
    <div id="pane-register" style="display:none">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-control" id="reg-user" type="text" placeholder="Choose a username"/>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-control" id="reg-email" type="email" placeholder="your@email.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" id="reg-pass" type="password" placeholder="Min 6 characters"/>
      </div>
      <button class="btn btn-primary" onclick="doRegister()">Create Account →</button>
      <div class="msg" id="reg-msg"></div>
    </div>
  </div>

  <div class="foot-note">
    AirBook &copy; 2024 — College Project Demo
  </div>
</div>

<script>
const API = '';  // same origin

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register')));
  document.getElementById('pane-login').style.display    = tab === 'login'    ? '' : 'none';
  document.getElementById('pane-register').style.display = tab === 'register' ? '' : 'none';
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = `msg show ${type}`;
}

async function doLogin() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  if (!username || !password) { showMsg('login-msg','Please fill in all fields.','error'); return; }
  try {
    const r = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    });
    const j = await r.json();
    if (!j.ok) { showMsg('login-msg', j.error, 'error'); return; }
    // Store session
    localStorage.setItem('airbook_user', JSON.stringify(j.data));
    showMsg('login-msg', 'Login successful! Redirecting...', 'success');
    setTimeout(() => {
      window.location.href = j.data.role === 'admin' ? '/admin' : '/';
    }, 700);
  } catch(e) { showMsg('login-msg','Cannot connect to server. Is server.py running?','error'); }
}

async function doRegister() {
  const username = document.getElementById('reg-user').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-pass').value;
  if (!username || !email || !password) { showMsg('reg-msg','Please fill in all fields.','error'); return; }
  if (password.length < 6) { showMsg('reg-msg','Password must be at least 6 characters.','error'); return; }
  try {
    const r = await fetch('/api/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, email, password })
    });
    const j = await r.json();
    if (!j.ok) { showMsg('reg-msg', j.error, 'error'); return; }
    showMsg('reg-msg', 'Account created! Signing you in...', 'success');
    // Auto-login
    const lr = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    });
    const lj = await lr.json();
    if (lj.ok) {
      localStorage.setItem('airbook_user', JSON.stringify(lj.data));
      setTimeout(() => { window.location.href = '/'; }, 800);
    }
  } catch(e) { showMsg('reg-msg','Cannot connect to server. Is server.py running?','error'); }
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const paneLogin = document.getElementById('pane-login');
    if (paneLogin.style.display !== 'none') doLogin(); else doRegister();
  }
});

// Redirect if already logged in
const saved = localStorage.getItem('airbook_user');
if (saved) {
  const u = JSON.parse(saved);
  window.location.href = u.role === 'admin' ? '/admin' : '/';
}
</script>
</body>
</html>
